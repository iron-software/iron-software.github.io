name: Sync API docs to iron-websites

# When new API docs reach `main` (usually the merged nightly PR), copy them into the website
# repo and open ONE pull request there, into `develop`. Nothing merges by itself.
#
# What runs (both scripts live in iron-websites, not here):
#   1. `manage:products:sync -- --apply` sets each product's site version to the newest release
#      on its package registry.
#   2. `manage:docs:sync -- --match-site --no-generate` copies the API docs for that version from
#      THIS commit into the site and splices in the site's header.
#
# The PR always comes from the `sync/object-reference` branch, rebuilt from `develop` on every
# run, so an open PR is refreshed rather than duplicated. No change: no push, no PR.
#
# Needs the secret IRON_WEBSITES_PR_TOKEN: a fine-grained token on iron-software/iron-websites
# with Contents and Pull requests read/write. The job's own GITHUB_TOKEN cannot write to
# another repository.
#
# The "Run workflow" button only works from the default branch (`main`); to test a copy of
# this file on another branch, use `gh workflow run object-reference-sync.yml --ref <branch>`.

on:
  push:
    branches: [main]
    paths: ["object-reference/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run both syncs and show the diff. Pushes nothing, opens no PR."
        type: boolean
        default: false

concurrency:
  group: object-reference-sync
  cancel-in-progress: false

env:
  WEBSITE_REPO: iron-software/iron-websites
  BASE: develop
  BRANCH: sync/object-reference

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # GITHUB_TOKEN only reads this repository. Every write to iron-websites uses the PAT.
    permissions:
      contents: read
    steps:
      - name: Check the secret this job needs
        env:
          PR_TOKEN: ${{ secrets.IRON_WEBSITES_PR_TOKEN }}
        run: |
          if [ -z "$PR_TOKEN" ]; then
            echo "::error title=Sync API docs::Missing repository secret IRON_WEBSITES_PR_TOKEN. Set it under Settings > Secrets and variables > Actions (needs a repository admin). Nothing was synced."
            exit 1
          fi

      # The commit that triggered the run, so the website gets exactly what was just merged.
      # LFS stays off: the docs are plain HTML; only the generator toolchain is in LFS.
      - name: Check out the API docs (this commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: github-io
          lfs: false
          persist-credentials: false

      # persist-credentials: false, or the checkout login stays in git config and is sent on
      # the push below instead of the PAT (iron-websites' helpcenter sync failed on a 403 this way).
      # LFS stays off: the sync touches no LFS-tracked file, so the pointers are left as they are.
      - name: Check out iron-websites (develop)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEBSITE_REPO }}
          ref: ${{ env.BASE }}
          path: iron-websites
          token: ${{ secrets.IRON_WEBSITES_PR_TOKEN }}
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: iron-websites/package-lock.json

      - name: Install the website's dependencies
        working-directory: iron-websites
        run: npm ci --no-audit --no-fund

      # A registry that does not answer makes this step fail, but the docs sync still runs; the
      # run turns red in the last step.
      - name: Update product versions from the package registries
        id: products
        continue-on-error: true
        working-directory: iron-websites
        run: npm run manage:products:sync -- --apply

      # `--no-generate`: this runner has no DocFX toolchain. A version missing from the archive is
      # reported in the log and that tree is left as it was.
      - name: Copy the API docs into the site
        working-directory: iron-websites
        run: npm run manage:docs:sync -- --source "$GITHUB_WORKSPACE/github-io" --match-site --no-generate

      - name: Commit, and open or refresh the PR
        working-directory: iron-websites
        env:
          GH_TOKEN: ${{ secrets.IRON_WEBSITES_PR_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git add -A -- src
          if git diff --cached --quiet; then
            echo "No change to the website. Nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            git diff --cached --stat | head -n 50
            echo "Dry run: nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "iron-apidocs-bot"
          git config user.email "docs-bot@ironsoftware.com"
          git commit -q -m "Sync API docs from iron-software.github.io ${GITHUB_SHA::10}"

          # Rebuilt from develop each run, so the force-push replaces the previous sync.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${WEBSITE_REPO}.git" "HEAD:refs/heads/${BRANCH}"

          printf '%s\n\n%s\n\n%s\n' \
            "***New API docs from iron-software.github.io, plus the product versions to match.***" \
            "This PR copies the API reference pages from ${SOURCE_URL} into the site and updates each product's version to its newest release. Opened by a workflow; review and merge by hand." \
            "Check: open one changed \`object-reference\` page on staging and the product page whose version changed." > pr-body.md

          open_pr=$(gh pr list --repo "$WEBSITE_REPO" --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --repo "$WEBSITE_REPO" --body-file pr-body.md
            echo "Refreshed PR #$open_pr." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --repo "$WEBSITE_REPO" --base "$BASE" --head "$BRANCH" \
              --title "[WEB-DEV] Sync the API docs from iron-software.github.io" --body-file pr-body.md
          fi

      - name: Fail the run if the product version update failed
        if: ${{ steps.products.outcome == 'failure' }}
        run: |
          echo "::error title=Sync API docs::manage:products:sync failed (registry error or bad arguments). The docs were still synced; see that step's log."
          exit 1

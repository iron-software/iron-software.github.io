# GitHub Pages (Jekyll) configuration for iron-software.github.io.
#
# Only the generated documentation under `object-reference/` is meant to be public. Everything
# else in this repo — the README, the generation tooling, the DocFX scaffolds, the product
# catalog, and the internal docs — is excluded from the published `_site`, so none of it is
# readable from the web (in particular, the README is not served at the site root).

title: Iron Software Object-Reference Documentation
description: Generated API documentation archive for Iron Software products.

exclude:
  - README.md
  - "*.py"
  - "*.mjs"
  - iron-products.json
  - package.json
  - package-lock.json
  - node_modules
  - __pycache__
  - scaffolds
  - docs
  - .vscode
  - .gitattributes
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
